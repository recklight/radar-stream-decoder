name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # Windows runners default to PowerShell, which judges a multi-line step by its
    # last command only; bash fails on any line.
    defaults:
      run:
        shell: bash
    env:
      # The Windows code page is cp1252, so Python would fail to print Chinese.
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安裝 Qt 執行所需的系統函式庫（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: 安裝專案（含全部選用套件）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: 檢查 Python 3.10 語法相容性
        shell: python
        run: |
          import ast, pathlib, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.py"):
              if any(p in f.parts for p in (".venv", "build", "dist", "__pycache__")):
                  continue
              try:
                  ast.parse(f.read_text(encoding="utf-8"), filename=str(f), feature_version=(3, 10))
              except SyntaxError as e:
                  bad.append(f"{f}: {e.msg}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all files parse as Python 3.10")

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q

  core-only:
    name: Core without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: 安裝專案（不含選用套件）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest（GUI 與 pandas 的測試會自動略過）
        run: pytest -q

  oldest-deps:
    name: Oldest supported dependencies (Python 3.10, no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: 安裝最舊的相依版本
        # typer 0.12 accepts any click 8, and the newest click rejects its
        # --x/--no-x flags, so click stays at 8.1 here.
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.*" "typer==0.12.*" "click==8.1.*" "pyserial==3.5" \
            "pandas==1.5.*" "pytest==7.2.*"
          pip install -e . --no-deps
      - name: Pytest（GUI 測試會自動略過）
        run: python -m pytest -q
